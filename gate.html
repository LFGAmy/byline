<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Required</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0A0D0D;color:#F5F7F6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.panel{max-width:460px;text-align:center}
.mark{width:40px;height:40px;margin:0 auto 26px;display:block;border:2px solid #26BD6C;border-radius:3px;
  position:relative}
.mark:after{content:"";position:absolute;inset:7px;border-top:2px solid #26BD6C;border-bottom:2px solid #26BD6C}
.eyebrow{color:#26BD6C;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
h1{font-size:28px;font-weight:800;margin-bottom:14px;line-height:1.2}
p{color:#9CA3AF;font-size:15px;line-height:1.6;margin-bottom:28px}
form{display:flex;gap:10px}
input{flex:1;background:#141A17;border:1px solid #262E29;color:#F5F7F6;font-size:14px;padding:12px 14px;font-family:inherit}
input:focus{outline:none;border-color:#26BD6C}
button{background:#26BD6C;border:none;color:#04110A;font-weight:700;font-size:14px;padding:12px 22px;
  font-family:inherit;cursor:pointer}
button:hover{background:#2FD87E}
.err{color:#FF6B6B;font-size:13px;margin-top:16px;display:none}
.foot{margin-top:36px;color:#4B5563;font-size:12px}
.foot a{color:#6B7280}
</style></head><body>
<div class="panel">
  <div class="mark"></div>
  <div class="eyebrow">Byline</div>
  <h1>Access code required</h1>
  <p>This document is private. If you were sent a link, it already includes your code. If you were sent a code, enter it below.</p>
  <form>
    <input id="k" type="text" placeholder="Enter access code" autocomplete="off" spellcheck="false">
    <button type="submit">Open</button>
  </form>
  <div class="err" id="err">That code isn't valid. Check it, or ask whoever sent it to you.</div>
  <div class="foot">Protected by <a href="https://github.com/LFGAmy/byline">Byline</a></div>
</div>
<script src="/gate.js"></script>
</body></html>
